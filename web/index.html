    <section id="how" class="band"><div class="wrap section">
      <div class="eyebrow">THE WORKFLOW</div><h2>One desk. Three jobs.</h2>
      <p class="lead">Live service records tell the agent where things stand. Past interactions tell it how to help.</p>
      <div class="cards">
        <article class="card"><span class="tile-icon">↺</span><span class="index">01</span><h3>Remember</h3><p>Recall preferences, attempted fixes, and missed commitments when a verified customer returns.</p></article>
        <article class="card"><span class="tile-icon">✓</span><span class="index">02</span><h3>Resolve</h3><p>Check current status and ETA, update a request, or book a slot through the connected provider.</p></article>
        <article class="card"><span class="tile-icon">↗</span><span class="index">03</span><h3>Recover</h3><p>Recognize when a fix failed or a promise slipped, then prepare a human handoff with the relevant context.</p></article>
      </div>
    </div></section>
    <section id="scenarios" class="wrap section">
      <div class="eyebrow">DEMO SCENARIOS</div><h2>See what memory changes.</h2>
      <div class="cards">
        <a class="card scenario" href="/desk?profile=alice"><span class="pill">Device Repair</span><h3>Alice returns</h3><p>Check a laptop repair without repeating the callback preference.</p><strong>Open scenario →</strong></a>
        <a class="card scenario" href="/desk?profile=bob"><span class="pill">Device Repair</span><h3>Bob is still offline</h3><p>Compare what the agent suggests before and after it recalls a failed reboot.</p><strong>Open scenario →</strong></a>
        <a class="card scenario" href="/desk?profile=carol"><span class="pill">IT Support</span><h3>Carol needs an owner</h3><p>Pick up two missed VPN deadlines and prepare a handoff for network operations.</p><strong>Open scenario →</strong></a>
      </div>
    </section>
    <section id="faq" class="band"><div class="wrap section faq">
      <div><div class="eyebrow">THE DETAILS</div><h2>Questions, answered.</h2></div>
      <div>
        <details><summary>Where does the status come from?</summary><p>Each provider adapter reads and normalizes its own service records. Status and ETA come from those records.</p></details>
        <details><summary>What changes when memory is off?</summary><p>The agent still sees the current ticket. It skips history recall and does not save that interaction to memory.</p></details>
        <details><summary>Can the agent make changes automatically?</summary><p>It can prepare a request, note, booking, or handoff. You review the details and confirm before the provider record changes.</p></details>
        <details><summary>Can I try both provider systems?</summary><p>Yes. Verify one of the Device Repair profiles or choose Carol to try the IT Support adapter. Demo records are fictional.</p></details>
      </div>
    </div></section>
